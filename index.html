<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f74e9a" />
  <meta name="description" content="A tiny pink pixel-art date invitation." />
  <link rel="icon" href="/heart-icon.svg" type="image/svg+xml" />
  <title>Date Invite ♥</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="app-shell" aria-labelledby="screen-title">
    <div class="sky sky-one"></div><div class="sky sky-two"></div>
    <div class="sparkles" aria-hidden="true"><span>✦</span><span>♥</span><span>✧</span><span>♡</span><span>✦</span><span>♥</span></div>
    <header class="topbar"><div class="brand-mark">♥</div><div class="brand-name">date invite</div><div class="tiny-status">FOR SOMEONE SPECIAL</div></header>
    <section id="app" class="screen-wrap" aria-live="polite"></section>
    <div class="mountains" aria-hidden="true"><div class="cloud cloud-a">▰▰</div><div class="cloud cloud-b">▰▰▰</div><div class="ridge ridge-back"></div><div class="ridge ridge-front"></div><div class="ground"></div></div>
  </main>
  <div id="modal-root"></div>
  <script src="/app.js"></script>
</body>
</html>
